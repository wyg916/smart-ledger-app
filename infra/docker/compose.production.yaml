name: smart-ledger-production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    environment:
      SMART_LEDGER_ENVIRONMENT: production
      SMART_LEDGER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      PUBLIC_BASE_URL: https://www.znjz.site
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?required}
      AUTH_IDENTITY_PEPPER: ${AUTH_IDENTITY_PEPPER:?required}
      INTERNAL_METRICS_TOKEN: ${INTERNAL_METRICS_TOKEN:?required}
      PHONE_AUTH_PROVIDER: tencent
      TENCENT_PHONE_SDK_APP_ID: ${TENCENT_PHONE_SDK_APP_ID:?required}
      TENCENT_PHONE_APP_KEY: ${TENCENT_PHONE_APP_KEY:?required}
      WECHAT_AUTH_PROVIDER: wechat
      WECHAT_APP_ID: ${WECHAT_APP_ID:?required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?required}
      KIMI_PROVIDER: kimi
      KIMI_AI_ENABLED: "true"
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:?required}
      TELEMETRY_ENABLED: "true"
      REVIEW_LOGIN_ENABLED: ${REVIEW_LOGIN_ENABLED:-true}
    command:
      - /bin/sh
      - -ec
      - uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=proxy
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIRECTORY:?required}:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  postgres-production-data:
