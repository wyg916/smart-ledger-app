name: FastAPI foundation

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main, "p1/**", "p1d/**", "p1e/**"]
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_ledger_ci
          POSTGRES_USER: ledger_ci
          POSTGRES_PASSWORD: ledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_ci -d smart_ledger_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KIMI_PROVIDER: fake
      KIMI_AI_ENABLED: "true"
      KIMI_LIVE_TEST: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Python and dependencies
        working-directory: services/api
        run: uv sync --frozen
      - name: Ruff format
        working-directory: services/api
        run: uv run ruff format --check .
      - name: Ruff lint
        working-directory: services/api
        run: uv run ruff check .
      - name: Type check
        working-directory: services/api
        run: uv run mypy .
      - name: Test
        working-directory: services/api
        run: uv run pytest
      - name: Verify Alembic upgrade and downgrade
        working-directory: services/api
        env:
          SMART_LEDGER_DATABASE_URL: sqlite+aiosqlite:////tmp/smart-ledger-ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: Verify PostgreSQL migration
        working-directory: services/api
        env:
          SMART_LEDGER_DATABASE_URL: postgresql+asyncpg://ledger_ci:ledger_ci@127.0.0.1:5432/smart_ledger_ci
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic downgrade base
