name: Legacy Android baseline

on:
  pull_request:
    paths:
      - "legacy/android-kotlin/**"
      - ".github/workflows/legacy-android.yml"
  push:
    branches: [main, "p1/**"]
    paths:
      - "legacy/android-kotlin/**"
      - ".github/workflows/legacy-android.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: legacy/android-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: legacy/android-kotlin/**/*.gradle*
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Build unsigned debug APK
        run: ./gradlew assembleDebug --stacktrace
